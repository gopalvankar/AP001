apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: grant-approval-workflow
  description: Automated grant application review routing workflow with SAP Task Center approval and SLA enforcement
  version: "1.0.0"
  type: n8nworkflow

projectVersion: "1"
sourceRoot: "."

workflow:
  definitionFile: grant-approval-workflow.n8n.json
  name: grant-approval-workflow
  ordId: sap.btpn8n:apiResource:ManagedN8nMcpServer:v1

provides:
  apis:
    - name: grant_application_submitted
      path: /grants-lifecycle-cecaf/grant-approval-workflow/grant-application-submitted
      kind: rest
      description: Webhook endpoint that triggers the grant application review and approval workflow when a new application is submitted
      ordId: "sap.n8nwfrt:apiResource:grants-lifecycle-cecaf_grant-approval-workflow.grantApplicationSubmitted:v1"
    - name: grant_application_submitted_mcp_server
      kind: mcp-server
      description: MCP server for grant application submitted operations
      ordId: "sap.n8nwfrt:apiResource:grants-lifecycle-cecaf_grant-approval-workflow.grantApplicationSubmittedMcpServer:v1"
